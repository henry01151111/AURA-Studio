<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>紀哥AI</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- Marked.js for Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- KaTeX for Math Formula Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .chat-bubble-user {
      background-color: #2563eb;
      color: white;
    }
    .chat-bubble-model {
      background-color: #e2e8f0;
      color: #0f172a;
    }
    /* Dark mode chat bubbles */
    .dark .chat-bubble-model {
      background-color: #334155;
      color: #f8fafc;
    }
    /* Markdown Styles within chat */
    .prose p { margin-bottom: 0.75rem; }
    .prose p:last-child { margin-bottom: 0; }
    .prose pre {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      margin: 0.5rem 0;
      font-size: 0.875rem;
    }
    .prose code {
      font-family: monospace;
      background-color: rgba(0,0,0,0.08);
      padding: 0.125rem 0.25rem;
      border-radius: 0.25rem;
    }
    .dark .prose code {
      background-color: rgba(255,255,255,0.15);
    }
    .prose pre code {
      background-color: transparent;
      padding: 0;
    }
    .prose ul { list-style-type: disc; padding-left: 1.25rem; margin: 0.5rem 0; }
    .prose ol { list-style-type: decimal; padding-left: 1.25rem; margin: 0.5rem 0; }
    .katex-display { margin: 0.5rem 0; overflow-x: auto; overflow-y: hidden; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Header / Navigation -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-10 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-md">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">紀哥AI</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">直連 Google AI Studio API</p>
        </div>
      </div>

      <!-- Settings Controls -->
      <div class="flex items-center gap-2 flex-wrap">
        <!-- Dark/Light Theme Toggle Button -->
        <button id="themeToggleBtn" class="px-3 py-1.5 text-xs md:text-sm font-medium bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg transition-colors flex items-center gap-1.5" title="切換深色/淺色模式">
          <i class="fa-solid fa-moon" id="themeIcon"></i>
          <span id="themeText">深色</span>
        </button>

        <button id="toggleSettingsBtn" class="px-3 py-1.5 text-xs md:text-sm font-medium bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg transition-colors flex items-center gap-1.5">
          <i class="fa-solid fa-sliders"></i>
          <span>API & 模型設定</span>
        </button>

        <!-- Export Chat Button Dropdown -->
        <div class="relative inline-block text-left">
          <button id="exportMenuBtn" class="px-3 py-1.5 text-xs md:text-sm font-medium bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-950/40 dark:hover:bg-emerald-900/50 text-emerald-600 dark:text-emerald-300 rounded-lg transition-colors flex items-center gap-1.5" title="匯出對話紀錄">
            <i class="fa-solid fa-file-export"></i>
            <span>匯出對話</span>
            <i class="fa-solid fa-chevron-down text-[10px]"></i>
          </button>
          <!-- Export Dropdown Menu -->
          <div id="exportDropdown" class="hidden absolute right-0 mt-1 w-36 bg-white dark:bg-slate-800 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 z-50 py-1">
            <button id="exportMdBtn" class="w-full text-left px-3 py-2 text-xs text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2">
              <i class="fa-solid fa-file-code text-blue-500"></i>
              <span>匯出為 .md</span>
            </button>
            <button id="exportTxtBtn" class="w-full text-left px-3 py-2 text-xs text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2">
              <i class="fa-solid fa-file-lines text-emerald-500"></i>
              <span>匯出為 .txt</span>
            </button>
          </div>
        </div>

        <!-- Clear Chat History Button -->
        <button id="clearChatBtn" class="px-3 py-1.5 text-xs md:text-sm font-medium bg-amber-50 hover:bg-amber-100 dark:bg-amber-950/40 dark:hover:bg-amber-900/50 text-amber-600 dark:text-amber-300 rounded-lg transition-colors flex items-center gap-1.5" title="僅清空畫面對話紀錄，保留 API Key 設定">
          <i class="fa-solid fa-trash-can"></i>
          <span>清除對話</span>
        </button>

        <!-- Reset Button -->
        <button id="resetAppBtn" class="px-3 py-1.5 text-xs md:text-sm font-medium bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 dark:hover:bg-rose-900/50 text-rose-600 dark:text-rose-300 rounded-lg transition-colors flex items-center gap-1.5" title="重置對話與清除本地 API Key 設定">
          <i class="fa-solid fa-rotate-left"></i>
          <span>重置</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Configuration Bar -->
  <div id="settingsPanel" class="bg-slate-100 dark:bg-slate-800/90 border-b border-slate-200 dark:border-slate-700 p-4 transition-all">
    <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-4">
      
      <!-- API Key Input -->
      <div class="md:col-span-6 space-y-1">
        <label for="apiKeyInput" class="block text-xs font-semibold text-slate-600 dark:text-slate-300">
          API Key <span class="text-rose-500">*</span>
        </label>
        <div class="flex gap-1.5 items-center">
          <div class="relative flex-1">
            <input type="password" id="apiKeyInput" placeholder="請貼上你的 AI Studio API Key (AIzaSy...)" 
              class="w-full pl-3 pr-10 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <button id="togglePasswordVisibility" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
              <i class="fa-solid fa-eye" id="eyeIcon"></i>
            </button>
          </div>
          <!-- Get API Key Link Button -->
          <a href="https://aistudio.google.com/api-keys" target="_blank" rel="noopener noreferrer" 
            class="px-3 py-2 text-xs font-medium bg-blue-50 hover:bg-blue-100 text-blue-600 dark:bg-blue-950/60 dark:hover:bg-blue-900/80 dark:text-blue-300 rounded-lg border border-blue-200 dark:border-blue-800 transition-colors flex items-center gap-1.5 shrink-0" 
            title="開啟 Google AI Studio 取得 API Key">
            <i class="fa-solid fa-key"></i>
            <span>取得 Key</span>
            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
          </a>
        </div>
      </div>

      <!-- Model Name Selection / Input -->
      <div class="md:col-span-4 space-y-1">
        <label for="modelSelect" class="block text-xs font-semibold text-slate-600 dark:text-slate-300">
          模型代碼 (Model Code)
        </label>
        <div class="space-y-1.5">
          <select id="modelSelect" 
            class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:outline-none cursor-pointer">
            
            <optgroup label="Gemini 3 系列">
              <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro (gemini-3.1-pro-preview)</option>
              <option value="gemini-3-flash-preview" selected>Gemini 3 Flash (gemini-3-flash-preview)</option>
            </optgroup>

            <optgroup label="Nano Banana 影像系列">
              <option value="gemini-nano-banana-2.1">Nano Banana 2.1 (gemini-nano-banana-2.1)</option>
              <option value="gemini-3.1-flash-image">Nano Banana 2 (gemini-3.1-flash-image)</option>
              <option value="gemini-3.1-flash-lite-image">Nano Banana 2 Lite (gemini-3.1-flash-lite-image)</option>
              <option value="gemini-3-pro-image">Nano Banana Pro (gemini-3-pro-image)</option>
            </optgroup>

            <optgroup label="Gemini 3.5 / 3.6 / 3.8 / 4 系列">
              <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (gemini-3.5-flash-lite)</option>
              <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite (gemini-3.1-flash-lite)</option>
              <option value="gemini-3.6-flash">Gemini 3.6 Flash (gemini-3.6-flash)</option>
              <option value="gemini-3.8-flash">Gemini 3.8 Flash (gemini-3.8-flash)</option>
              <option value="gemini-4-argon">Gemini 4 Argon (gemini-4-argon)</option>
            </optgroup>

            <optgroup label="其他">
              <option value="custom">其他 (手動輸入模型代碼...)</option>
            </optgroup>

          </select>

          <!-- Custom Model Input (shown when "custom" is selected) -->
          <input type="text" id="customModelInput" placeholder="請輸入自訂模型代碼 (例如: gemini-custom-model)" 
            class="hidden w-full px-3 py-1.5 text-xs rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
      </div>

      <!-- Save & Remember -->
      <div class="md:col-span-2 flex items-end">
        <button id="saveSettingsBtn" class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm transition-colors shadow-sm flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-check"></i>
          <span>儲存設定</span>
        </button>
      </div>

      <!-- System Prompt Area -->
      <div class="md:col-span-12 space-y-1">
        <label for="systemPromptInput" class="block text-xs font-semibold text-slate-600 dark:text-slate-300">
          系統指令 System Instruction (可選)
        </label>
        <input type="text" id="systemPromptInput" placeholder="例如：你是一個精通繁體中文的專業程式設計導師，請用簡明扼要的方式回答。" 
          class="w-full px-3 py-1.5 text-xs rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
    </div>
  </div>

  <!-- Status Notification Banner -->
  <div id="statusBanner" class="hidden max-w-5xl mx-auto my-2 px-4 py-2 rounded-lg text-xs font-medium flex items-center justify-between">
    <span id="statusText"></span>
    <button onclick="hideStatusBanner()" class="text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 ml-2">&times;</button>
  </div>

  <!-- Main Chat Container -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 flex flex-col justify-between overflow-hidden">
    
    <!-- Chat Messages Area -->
    <div id="chatHistory" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4 scroll-smooth">
      <!-- Welcome Message -->
      <div class="flex items-start gap-3">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white text-sm shrink-0">
          <i class="fa-solid fa-robot"></i>
        </div>
        <div class="chat-bubble-model px-4 py-3 rounded-2xl rounded-tl-none max-w-[85%] shadow-sm prose text-sm">
          <p>你好！我是紀哥AI，請先設定 API Key 即可開始對話。</p>
        </div>
      </div>
    </div>

    <!-- Image Preview Area -->
    <div id="imagePreviewContainer" class="hidden mb-2 p-2 bg-slate-200 dark:bg-slate-800 rounded-lg inline-flex items-center gap-2 self-start">
      <img id="imagePreview" class="h-16 w-16 object-cover rounded-md border border-slate-300 dark:border-slate-600" src="" alt="預覽圖片">
      <div class="flex flex-col">
        <span id="imageFileName" class="text-xs font-medium truncate max-w-[150px]"></span>
        <button id="removeImageBtn" class="text-xs text-rose-500 hover:underline text-left mt-1">移除圖片</button>
      </div>
    </div>

    <!-- Input Form -->
    <form id="chatForm" class="relative bg-white dark:bg-slate-800 rounded-2xl border border-slate-300 dark:border-slate-700 shadow-md p-2 flex items-end gap-2">
      
      <!-- Image Upload Button -->
      <label for="imageInput" class="p-2 text-slate-500 hover:text-blue-600 dark:text-slate-400 dark:hover:text-blue-400 cursor-pointer rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors flex items-center justify-center" title="上傳圖片">
        <i class="fa-solid fa-paperclip text-lg"></i>
        <input type="file" id="imageInput" accept="image/*" class="hidden">
      </label>

      <!-- Message Textarea -->
      <textarea id="userInput" rows="1" placeholder="輸入訊息... (Shift + Enter 換行)" 
        class="flex-1 bg-transparent border-0 focus:ring-0 focus:outline-none resize-none max-h-32 py-2 px-1 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500"></textarea>

      <!-- Submit Button -->
      <button type="submit" id="sendBtn" class="p-2.5 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 dark:disabled:bg-slate-700 text-white rounded-xl transition-colors shrink-0 shadow-sm">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </form>
    
    <div class="text-center text-[10px] text-slate-400 dark:text-slate-500 mt-2">
      所有請求直接與 Google Gemini API 通訊，你的 API Key僅存於本地瀏覽器。
    </div>

  </main>

  <!-- Selection Tooltip Popup Menu -->
  <div id="selectionMenu" class="hidden absolute z-50 bg-slate-800 dark:bg-slate-700 text-white rounded-xl shadow-xl p-1 flex items-center gap-1 border border-slate-600/50 text-xs transition-opacity duration-150">
    <button id="copySelectBtn" class="px-2.5 py-1.5 hover:bg-slate-700 dark:hover:bg-slate-600 rounded-lg flex items-center gap-1 transition-colors">
      <i class="fa-solid fa-copy text-blue-400"></i>
      <span>複製</span>
    </button>
    <div class="w-[1px] h-4 bg-slate-600"></div>
    <button id="askSelectBtn" class="px-2.5 py-1.5 hover:bg-slate-700 dark:hover:bg-slate-600 rounded-lg flex items-center gap-1 transition-colors">
      <i class="fa-solid fa-circle-question text-emerald-400"></i>
      <span>深入詢問</span>
    </button>
  </div>

  <!-- JavaScript App Logic -->
  <script>
    // State Management
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let modelName = localStorage.getItem('gemini_model_name') || 'gemini-3-flash-preview';
    let systemInstruction = localStorage.getItem('gemini_system_instruction') || '';
    let currentTheme = localStorage.getItem('gemini_theme') || 'dark'; // Default theme set to dark
    let chatConversation = []; // Stores formatted API conversation history
    let currentBase64Image = null; // Store loaded image base64 data

    // DOM Elements
    const htmlElement = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    const apiKeyInput = document.getElementById('apiKeyInput');
    const modelSelect = document.getElementById('modelSelect');
    const customModelInput = document.getElementById('customModelInput');
    const systemPromptInput = document.getElementById('systemPromptInput');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const toggleSettingsBtn = document.getElementById('toggleSettingsBtn');
    const settingsPanel = document.getElementById('settingsPanel');
    const togglePasswordVisibility = document.getElementById('togglePasswordVisibility');
    const eyeIcon = document.getElementById('eyeIcon');
    const clearChatBtn = document.getElementById('clearChatBtn');
    const resetAppBtn = document.getElementById('resetAppBtn');

    // Export Dropdown Elements
    const exportMenuBtn = document.getElementById('exportMenuBtn');
    const exportDropdown = document.getElementById('exportDropdown');
    const exportMdBtn = document.getElementById('exportMdBtn');
    const exportTxtBtn = document.getElementById('exportTxtBtn');

    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const imageInput = document.getElementById('imageInput');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const imageFileName = document.getElementById('imageFileName');
    const removeImageBtn = document.getElementById('removeImageBtn');

    const statusBanner = document.getElementById('statusBanner');
    const statusText = document.getElementById('statusText');

    // Text Selection Floating Menu Elements
    const selectionMenu = document.getElementById('selectionMenu');
    const copySelectBtn = document.getElementById('copySelectBtn');
    const askSelectBtn = document.getElementById('askSelectBtn');
    let selectedTextContent = '';

    // Initialize UI and Theme on load
    window.addEventListener('DOMContentLoaded', () => {
      // Initialize Theme (Default Dark)
      applyTheme(currentTheme);

      apiKeyInput.value = apiKey;
      systemPromptInput.value = systemInstruction;

      // Restore Model Selection logic
      initModelSelection(modelName);

      if (apiKey) {
        showStatus('已載入儲存的 API Key', 'success');
      } else {
        showStatus('請先設定你的 API Key', 'warning');
      }

      // Configure Marked markdown
      marked.setOptions({
        breaks: true,
        gfm: true
      });

      // Render math on initial content
      renderMath(chatHistory);
    });

    // Helper to initialize and bind model selection
    function initModelSelection(currentModel) {
      const options = Array.from(modelSelect.options).map(o => o.value);
      if (options.includes(currentModel) && currentModel !== 'custom') {
        modelSelect.value = currentModel;
        customModelInput.classList.add('hidden');
      } else {
        modelSelect.value = 'custom';
        customModelInput.value = currentModel;
        customModelInput.classList.remove('hidden');
      }
    }

    // Toggle custom model input display when select changes
    modelSelect.addEventListener('change', () => {
      if (modelSelect.value === 'custom') {
        customModelInput.classList.remove('hidden');
        customModelInput.focus();
      } else {
        customModelInput.classList.add('hidden');
      }
    });

    // Render Math Formulas with KaTeX
    function renderMath(element) {
      if (window.renderMathInElement) {
        window.renderMathInElement(element, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
          ],
          throwOnError: false
        });
      }
    }

    // Toggle Export Dropdown
    exportMenuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      exportDropdown.classList.toggle('hidden');
    });

    document.addEventListener('click', () => {
      exportDropdown.classList.add('hidden');
    });

    // Export Chat Handlers
    exportMdBtn.addEventListener('click', () => exportChatHistory('md'));
    exportTxtBtn.addEventListener('click', () => exportChatHistory('txt'));

    function exportChatHistory(format) {
      if (chatConversation.length === 0) {
        showStatus('目前沒有可以匯出的對話紀錄', 'warning');
        return;
      }

      let content = `# 紀哥AI 對話紀錄\n\n`;
      content += `匯出時間：${new Date().toLocaleString('zh-TW')}\n`;
      content += `使用模型：${modelName}\n\n---\n\n`;

      chatConversation.forEach((msg, index) => {
        const role = msg.role === 'user' ? '使用者' : '紀哥AI';
        const textParts = msg.parts.map(p => p.text || '[圖片訊息]').join('\n');
        
        if (format === 'md') {
          content += `### 👤 ${role}\n${textParts}\n\n`;
        } else {
          content += `[${role}]\n${textParts}\n\n----------------------------------------\n\n`;
        }
      });

      const mimeType = format === 'md' ? 'text/markdown' : 'text/plain';
      const extension = format === 'md' ? 'md' : 'txt';
      const filename = `Chat_History_${new Date().toISOString().slice(0, 10)}.${extension}`;

      const blob = new Blob([content], { type: `${mimeType};charset=utf-8` });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showStatus(`成功匯出對話為 .${extension} 檔案`, 'success');
      exportDropdown.classList.add('hidden');
    }

    // Auto-resize textarea height
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 128) + 'px';
    });

    // Enter to submit (Shift+Enter for newline)
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event('submit'));
      }
    });

    // Toggle Settings View
    toggleSettingsBtn.addEventListener('click', () => {
      settingsPanel.classList.toggle('hidden');
    });

    // Toggle Password Visibility
    togglePasswordVisibility.addEventListener('click', () => {
      if (apiKeyInput.type === 'password') {
        apiKeyInput.type = 'text';
        eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        apiKeyInput.type = 'password';
        eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });

    // Save Settings
    saveSettingsBtn.addEventListener('click', () => {
      apiKey = apiKeyInput.value.trim();
      
      // Determine model name from select or custom input
      if (modelSelect.value === 'custom') {
        modelName = customModelInput.value.trim() || 'gemini-3-flash-preview';
      } else {
        modelName = modelSelect.value;
      }

      systemInstruction = systemPromptInput.value.trim();

      if (!apiKey) {
        showStatus('請輸入有效的 API Key', 'error');
        return;
      }

      localStorage.setItem('gemini_api_key', apiKey);
      localStorage.setItem('gemini_model_name', modelName);
      localStorage.setItem('gemini_system_instruction', systemInstruction);

      showStatus('設定已成功儲存！', 'success');
      settingsPanel.classList.add('hidden');
    });

    // Clear Chat History Only (Keep API Key & Settings)
    clearChatBtn.addEventListener('click', () => {
      chatConversation = [];
      chatHistory.innerHTML = `
        <div class="flex items-start gap-3">
          <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white text-sm shrink-0">
            <i class="fa-solid fa-robot"></i>
          </div>
          <div class="chat-bubble-model px-4 py-3 rounded-2xl rounded-tl-none max-w-[85%] shadow-sm prose text-sm">
            <p>對話紀錄已清除！API Key 與設定仍保留中，您可以直接繼續發問。</p>
          </div>
        </div>
      `;
      showStatus('對話紀錄已成功清除', 'info');
    });

    // Reset Application & Clear LocalStorage Data (Fixed Functionality)
    resetAppBtn.addEventListener('click', () => {
      // Clear Local Storage Keys directly
      localStorage.removeItem('gemini_api_key');
      localStorage.removeItem('gemini_model_name');
      localStorage.removeItem('gemini_system_instruction');

      // Reset variables
      apiKey = '';
      modelName = 'gemini-3-flash-preview';
      systemInstruction = '';
      chatConversation = [];

      // Reset Input Elements
      apiKeyInput.value = '';
      modelSelect.value = 'gemini-3-flash-preview';
      customModelInput.value = '';
      customModelInput.classList.add('hidden');
      systemPromptInput.value = '';

      // Reset Chat UI
      chatHistory.innerHTML = `
        <div class="flex items-start gap-3">
          <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white text-sm shrink-0">
            <i class="fa-solid fa-robot"></i>
          </div>
          <div class="chat-bubble-model px-4 py-3 rounded-2xl rounded-tl-none max-w-[85%] shadow-sm prose text-sm">
            <p>已重置並清除所有紀錄與 API Key！請重新點擊「API & 模型設定」輸入 API Key 開始使用。</p>
          </div>
        </div>
      `;

      showStatus('所有資料與 API Key 已成功重置清除', 'info');
      settingsPanel.classList.remove('hidden');
    });

    // Handle Image Upload & Convert to Base64
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        if (!file.type.startsWith('image/')) {
          showStatus('請選擇有效的圖片檔案', 'error');
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          const base64Data = event.target.result.split(',')[1];
          currentBase64Image = {
            mimeType: file.type,
            data: base64Data
          };
          imagePreview.src = event.target.result;
          imageFileName.textContent = file.name;
          imagePreviewContainer.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    // Remove Selected Image
    removeImageBtn.addEventListener('click', () => {
      currentBase64Image = null;
      imageInput.value = '';
      imagePreviewContainer.classList.add('hidden');
    });

    // Form Submit (Send Message)
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();

      if (!text && !currentBase64Image) return;

      if (!apiKey) {
        showStatus('請先設定你的 Google AI Studio API Key！', 'error');
        settingsPanel.classList.remove('hidden');
        return;
      }

      // UI update for user message
      appendUserMessage(text, currentBase64Image ? imagePreview.src : null);

      // Construct request payload message parts
      const userParts = [];
      if (text) {
        userParts.push({ text: text });
      }
      if (currentBase64Image) {
        userParts.push({
          inlineData: {
            mimeType: currentBase64Image.mimeType,
            data: currentBase64Image.data
          }
        });
      }

      // Push to API history context
      chatConversation.push({
        role: 'user',
        parts: userParts
      });

      // Clear input state
      userInput.value = '';
      userInput.style.height = 'auto';
      currentBase64Image = null;
      imageInput.value = '';
      imagePreviewContainer.classList.add('hidden');

      // Create model message placeholder in UI
      const modelBubbleElement = appendModelMessageLoading();

      // Disable Send Button during API request
      sendBtn.disabled = true;

      try {
        const responseText = await callGeminiAPI();
        
        // Update UI with rendered markdown text
        modelBubbleElement.innerHTML = marked.parse(responseText);
        // Render math formulas within the response bubble
        renderMath(modelBubbleElement);

        // Store model response in conversation history
        chatConversation.push({
          role: 'model',
          parts: [{ text: responseText }]
        });

      } catch (error) {
        console.error('API Request Error:', error);
        modelBubbleElement.innerHTML = `<span class="text-rose-500 font-semibold"><i class="fa-solid fa-circle-exclamation mr-1"></i>錯誤: ${escapeHtml(error.message)}</span>`;
        // Remove last failed user message from conversation context
        chatConversation.pop();
      } finally {
        sendBtn.disabled = false;
        scrollToBottom();
      }
    });

    // Helper: Append User Message to UI
    function appendUserMessage(text, imageSrc) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex items-start gap-3 justify-end';

      let imgHtml = imageSrc ? `<img src="${imageSrc}" class="max-h-48 rounded-lg mb-2 border border-blue-400">` : '';
      let textHtml = text ? `<p>${escapeHtml(text)}</p>` : '';

      msgDiv.innerHTML = `
        <div class="chat-bubble-user px-4 py-3 rounded-2xl rounded-tr-none max-w-[85%] shadow-sm text-sm">
          ${imgHtml}
          ${textHtml}
        </div>
        <div class="w-8 h-8 rounded-lg bg-slate-700 flex items-center justify-center text-white text-sm shrink-0">
          <i class="fa-solid fa-user"></i>
        </div>
      `;
      chatHistory.appendChild(msgDiv);
      renderMath(msgDiv);
      scrollToBottom();
    }

    // Helper: Append Loading Placeholder for Model Response
    function appendModelMessageLoading() {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex items-start gap-3';

      msgDiv.innerHTML = `
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white text-sm shrink-0">
          <i class="fa-solid fa-robot"></i>
        </div>
        <div class="chat-bubble-model px-4 py-3 rounded-2xl rounded-tl-none max-w-[85%] shadow-sm prose text-sm">
          <span class="inline-flex items-center gap-1.5 text-slate-500 dark:text-slate-400">
            <i class="fa-solid fa-circle-notch fa-spin"></i> 思考中...
          </span>
        </div>
      `;
      chatHistory.appendChild(msgDiv);
      scrollToBottom();
      return msgDiv.querySelector('.chat-bubble-model');
    }

    // Status Banner Notification Helper
    function showStatus(message, type = 'info') {
      statusText.textContent = message;
      statusBanner.classList.remove('hidden', 'bg-blue-100', 'text-blue-800', 'bg-emerald-100', 'text-emerald-800', 'bg-amber-100', 'text-amber-800', 'bg-rose-100', 'text-rose-800', 'dark:bg-blue-900/60', 'dark:text-blue-200', 'dark:bg-emerald-900/60', 'dark:text-emerald-200', 'dark:bg-amber-900/60', 'dark:text-amber-200', 'dark:bg-rose-900/60', 'dark:text-rose-200');

      if (type === 'success') {
        statusBanner.classList.add('bg-emerald-100', 'text-emerald-800', 'dark:bg-emerald-900/60', 'dark:text-emerald-200');
      } else if (type === 'warning') {
        statusBanner.classList.add('bg-amber-100', 'text-amber-800', 'dark:bg-amber-900/60', 'dark:text-amber-200');
      } else if (type === 'error') {
        statusBanner.classList.add('bg-rose-100', 'text-rose-800', 'dark:bg-rose-900/60', 'dark:text-rose-200');
      } else {
        statusBanner.classList.add('bg-blue-100', 'text-blue-800', 'dark:bg-blue-900/60', 'dark:text-blue-200');
      }
    }

    function hideStatusBanner() {
      statusBanner.classList.add('hidden');
    }

    function scrollToBottom() {
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }

    // Text Selection Floating Menu Logic
    function handleSelectionChange(e) {
      // Small delay to allow text selection to settle (especially for mobile touch events)
      setTimeout(() => {
        const selection = window.getSelection();
        const text = selection ? selection.toString().trim() : '';

        if (!text) {
          hideSelectionMenu();
          return;
        }

        selectedTextContent = text;

        // Position the popover menu near selection/cursor
        const range = selection.getRangeAt(0);
        const rect = range.getBoundingClientRect();

        if (rect.width === 0 || rect.height === 0) {
          hideSelectionMenu();
          return;
        }

        const menuWidth = selectionMenu.offsetWidth || 150;
        const menuHeight = selectionMenu.offsetHeight || 36;

        // Calculate positioning above the selected text area
        let top = rect.top + window.scrollY - menuHeight - 8;
        let left = rect.left + window.scrollX + (rect.width / 2) - (menuWidth / 2);

        // Keep inside viewport bounds
        if (top < window.scrollY + 10) {
          top = rect.bottom + window.scrollY + 8; // Show below if too close to top
        }
        if (left < 10) left = 10;
        if (left + menuWidth > window.innerWidth - 10) {
          left = window.innerWidth - menuWidth - 10;
        }

        selectionMenu.style.top = `${top}px`;
        selectionMenu.style.left = `${left}px`;
        selectionMenu.classList.remove('hidden');
      }, 10);
    }

    function hideSelectionMenu() {
      selectionMenu.classList.add('hidden');
    }

    // Event listeners for text selection
    document.addEventListener('mouseup', (e) => {
      if (selectionMenu.contains(e.target)) return;
      handleSelectionChange(e);
    });

    document.addEventListener('touchend', (e) => {
      if (selectionMenu.contains(e.target)) return;
      handleSelectionChange(e);
    });

    document.addEventListener('mousedown', (e) => {
      if (!selectionMenu.contains(e.target)) {
        hideSelectionMenu();
      }
    });

    // Copy Selected Text Handler
    copySelectBtn.addEventListener('click', () => {
      if (!selectedTextContent) return;
      
      const tempTextArea = document.createElement('textarea');
      tempTextArea.value = selectedTextContent;
      document.body.appendChild(tempTextArea);
      tempTextArea.select();
      document.execCommand('copy');
      document.body.removeChild(tempTextArea);

      showStatus('已將選取文字複製到剪貼簿', 'success');
      hideSelectionMenu();
      window.getSelection().removeAllRanges();
    });

    // Deep Ask Selected Text Handler
    askSelectBtn.addEventListener('click', () => {
      if (!selectedTextContent) return;

      userInput.value = `請幫我詳細說明以下內容：\n"${selectedTextContent}"\n\n`;
      userInput.focus();

      // Trigger auto-resize for text area height
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 128) + 'px';

      hideSelectionMenu();
      window.getSelection().removeAllRanges();
    });
  </script>
</body>
</html>
